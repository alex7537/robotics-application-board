<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A lightweight Masterarbeit and AI Robotics application tracker.">
  <title>Robotics Application Board</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-soft: #f8fafb;
      --text: #18212b;
      --muted: #69737d;
      --line: #e3e8ed;
      --accent: #2864dc;
      --accent-soft: #edf3ff;
      --green: #16835f;
      --amber: #a56400;
      --red: #b23a3a;
      --shadow: 0 8px 30px rgba(25, 37, 50, 0.07);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button, select { cursor: pointer; }
    a { color: var(--accent); }
    .shell { max-width: 1500px; margin: 0 auto; padding: 32px 24px 48px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 7px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); line-height: 1.08; letter-spacing: -.035em; }
    .subtitle { margin: 10px 0 0; max-width: 700px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .view-tabs { display: inline-flex; gap: 5px; margin: 0 0 20px; padding: 5px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
    .view-tab { border: 0; border-radius: 8px; padding: 9px 14px; background: transparent; color: var(--muted); font-weight: 800; }
    .view-tab.active { background: var(--accent); color: #fff; }
    .view[hidden] { display: none; }
    .button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 13px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      box-shadow: 0 1px 2px rgba(0,0,0,.02);
    }
    .button:hover { border-color: #b9c5d1; transform: translateY(-1px); }
    .button.primary { border-color: var(--accent); background: var(--accent); color: white; }
    #fileInput { display: none; }
    .summary { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .metric { border: 1px solid var(--line); border-radius: 14px; padding: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .metric-label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .metric-value { display: block; margin-top: 5px; font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 2fr) repeat(4, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .control {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface-soft);
      color: var(--text);
      padding: 9px 11px;
      outline: none;
    }
    .control:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .notice { display: none; margin: 0 0 16px; padding: 11px 14px; border: 1px solid #c9d8f7; border-radius: 10px; background: var(--accent-soft); color: #234b9b; }
    .notice.visible { display: block; }
    .board { display: grid; grid-template-columns: repeat(5, minmax(240px, 1fr)); gap: 14px; overflow-x: auto; padding: 2px 2px 16px; }
    .column { min-height: 440px; border: 1px solid var(--line); border-radius: var(--radius); background: #edf0f3; }
    .column-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 11px; border-radius: var(--radius) var(--radius) 0 0; background: rgba(237,240,243,.96); backdrop-filter: blur(8px); }
    .column-title { margin: 0; font-size: 14px; }
    .count { min-width: 25px; border-radius: 99px; padding: 2px 8px; background: var(--surface); color: var(--muted); text-align: center; font-size: 12px; font-weight: 800; }
    .cards { display: grid; gap: 10px; padding: 0 10px 12px; }
    .card { border: 1px solid var(--line); border-radius: 13px; padding: 14px; background: var(--surface); box-shadow: 0 3px 12px rgba(25,37,50,.05); }
    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .org { margin: 0; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .035em; text-transform: uppercase; }
    .priority { flex: 0 0 auto; width: 9px; height: 9px; margin-top: 4px; border-radius: 50%; background: #9aa4ae; }
    .priority.high { background: var(--red); box-shadow: 0 0 0 3px #fbecec; }
    .priority.medium { background: var(--amber); box-shadow: 0 0 0 3px #fff3dc; }
    .priority.low { background: var(--green); box-shadow: 0 0 0 3px #e5f5ef; }
    .title { margin: 7px 0 6px; font-size: 16px; line-height: 1.3; letter-spacing: -.01em; }
    .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
    .tag { border-radius: 99px; padding: 3px 7px; background: #f0f3f6; color: #4d5964; font-size: 11px; }
    .tag.networking { background: #f2eefe; color: #6747aa; }
    .tag.status { background: var(--accent-soft); color: #2852a3; }
    .next { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; }
    .next strong { display: block; margin-bottom: 2px; color: var(--muted); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    details { margin-top: 10px; font-size: 12px; }
    summary { color: var(--muted); cursor: pointer; font-weight: 700; }
    .details-grid { display: grid; gap: 7px; margin-top: 8px; color: var(--muted); overflow-wrap: anywhere; }
    .details-grid b { color: var(--text); }
    .empty { padding: 28px 12px; color: #8a949d; text-align: center; font-size: 13px; }
    .footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 22px; color: var(--muted); font-size: 12px; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; }

    @media (max-width: 1050px) {
      .toolbar { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar .search { grid-column: 1 / -1; }
      .summary { grid-template-columns: repeat(5, minmax(105px, 1fr)); overflow-x: auto; }
    }
    @media (max-width: 700px) {
      .shell { padding: 22px 14px 36px; }
      .topbar { display: block; }
      .actions { justify-content: flex-start; margin-top: 18px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: visible; }
      .summary .metric:last-child { grid-column: 1 / -1; }
      .toolbar { grid-template-columns: 1fr; }
      .toolbar .search { grid-column: auto; }
      .board { grid-template-columns: repeat(5, minmax(280px, 86vw)); }
      .footer { display: block; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Masterarbeit · AI Robotics</p>
        <h1>Application Board</h1>
        <p class="subtitle">One quiet place for applications, research opportunities, follow-ups, and robotics networking.</p>
      </div>
      <div class="actions" aria-label="Data actions">
        <label class="button" for="fileInput">Import JSON</label>
        <input id="fileInput" type="file" accept="application/json,.json">
        <button class="button" id="exportButton" type="button">Export JSON</button>
        <button class="button primary" id="resetButton" type="button">Reload source</button>
      </div>
    </header>

    <nav class="view-tabs" aria-label="Board sections">
      <button class="view-tab active" type="button" data-view="applications">Applications</button>
      <button class="view-tab" type="button" data-view="luh">LUH Professors &amp; Projects</button>
    </nav>

    <div class="view" id="applicationsView">
      <section class="summary" aria-label="Application summary" id="summary"></section>

      <section class="toolbar" aria-label="Filters">
        <input class="control search" id="searchInput" type="search" placeholder="Search organization, role, focus, notes…" aria-label="Search applications">
        <select class="control" id="cityFilter" aria-label="Filter by city"><option value="">All cities</option></select>
        <select class="control" id="categoryFilter" aria-label="Filter by category"><option value="">All types</option></select>
        <select class="control" id="statusFilter" aria-label="Filter by status"><option value="">All statuses</option></select>
        <select class="control" id="sortSelect" aria-label="Sort applications">
          <option value="priority">Priority: high first</option>
          <option value="recent">Most recent activity</option>
          <option value="organization">Organization A–Z</option>
        </select>
      </section>

      <p class="notice" id="notice" role="status"></p>
      <section class="board" id="board" aria-label="Application Kanban board"></section>

      <footer class="footer">
        <div class="legend" aria-label="Priority legend">
          <span><i style="background:#b23a3a"></i> High</span>
          <span><i style="background:#a56400"></i> Medium</span>
          <span><i style="background:#16835f"></i> Low</span>
        </div>
        <div id="sourceInfo">Loading data…</div>
      </footer>
    </div>

    <div class="view" id="luhView" hidden>
      <section class="summary" aria-label="LUH outreach summary" id="luhSummary"></section>

      <section class="toolbar" aria-label="LUH filters">
        <input class="control search" id="luhSearchInput" type="search" placeholder="Search professor, institute, project, focus…" aria-label="Search LUH records">
        <select class="control" id="luhInstituteFilter" aria-label="Filter by institute"><option value="">All institutes</option></select>
        <select class="control" id="luhStatusFilter" aria-label="Filter LUH status"><option value="">All statuses</option></select>
      </section>

      <p class="notice" id="luhNotice" role="status"></p>
      <section class="board" id="luhBoard" aria-label="LUH professors and projects board"></section>

      <footer class="footer">
        <div>Public-safe summaries only · email addresses and private message text are not stored</div>
        <div id="luhSourceInfo">Loading LUH data…</div>
      </footer>
    </div>
  </main>

  <script>
    const columns = ["Found", "Applied", "Waiting", "Interview", "Closed"];
    const summaryStatuses = ["Applied", "Waiting", "Interview", "Rejected", "Offer"];
    const luhColumns = ["Discovered", "Reviewed", "Contacted", "Replied", "Follow-up"];
    const luhSummaryStatuses = ["Discovered", "Reviewed", "Contacted", "Replied"];
    const priorityRank = { High: 0, Medium: 1, Low: 2 };
    let applications = [];
    let luhRecords = [];
    let sourceLabel = "";
    let luhSourceLabel = "";

    const els = {
      board: document.querySelector("#board"),
      summary: document.querySelector("#summary"),
      search: document.querySelector("#searchInput"),
      city: document.querySelector("#cityFilter"),
      category: document.querySelector("#categoryFilter"),
      status: document.querySelector("#statusFilter"),
      sort: document.querySelector("#sortSelect"),
      notice: document.querySelector("#notice"),
      sourceInfo: document.querySelector("#sourceInfo"),
      file: document.querySelector("#fileInput"),
      luhBoard: document.querySelector("#luhBoard"),
      luhSummary: document.querySelector("#luhSummary"),
      luhSearch: document.querySelector("#luhSearchInput"),
      luhInstitute: document.querySelector("#luhInstituteFilter"),
      luhStatus: document.querySelector("#luhStatusFilter"),
      luhNotice: document.querySelector("#luhNotice"),
      luhSourceInfo: document.querySelector("#luhSourceInfo")
    };

    const escapeHtml = value => String(value ?? "").replace(/[&<>'"]/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
    })[char]);

    function normalize(item, index) {
      return {
        id: item.id || `record-${index + 1}`,
        organization: item.organization || "Unknown organization",
        city: item.city || "Unknown",
        title: item.title || "Untitled opportunity",
        category: item.category || "company",
        technical_focus: Array.isArray(item.technical_focus) ? item.technical_focus : [],
        status: item.status || "Found",
        applied_date: item.applied_date || "",
        last_contact: item.last_contact || "",
        next_action: item.next_action || "",
        application_link: item.application_link || "",
        contact_person: item.contact_person || "",
        contact_channel: item.contact_channel || "",
        notes: item.notes || "",
        priority: item.priority || "Medium",
        record_type: item.record_type || "application"
      };
    }

    function validateAndSet(data, label) {
      if (!Array.isArray(data)) throw new Error("The JSON root must be an array.");
      applications = data.map(normalize);
      sourceLabel = label;
      populateFilters();
      render();
    }

    function normalizeLuh(item, index) {
      return {
        id: item.id || `luh-record-${index + 1}`,
        institute: item.institute || "LUH",
        contact_person: item.contact_person || "",
        title: item.title || "Untitled LUH opportunity",
        technical_focus: Array.isArray(item.technical_focus) ? item.technical_focus : [],
        status: item.status || "Discovered",
        reviewed_date: item.reviewed_date || "",
        first_contact: item.first_contact || "",
        last_contact: item.last_contact || "",
        next_action: item.next_action || "",
        project_link: item.project_link || "",
        notes: item.notes || "",
        priority: item.priority || "Medium",
        evidence: item.evidence || ""
      };
    }

    function validateAndSetLuh(data, label) {
      if (!Array.isArray(data)) throw new Error("The LUH JSON root must be an array.");
      luhRecords = data.map(normalizeLuh);
      luhSourceLabel = label;
      populateLuhFilters();
      renderLuh();
    }

    function showNotice(message) {
      els.notice.textContent = message;
      els.notice.classList.add("visible");
    }

    function clearNotice() {
      els.notice.classList.remove("visible");
      els.notice.textContent = "";
    }

    function populateSelect(select, values, labelMap = {}) {
      const current = select.value;
      const first = select.options[0];
      select.replaceChildren(first);
      [...new Set(values.filter(Boolean))].sort().forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = labelMap[value] || value;
        select.append(option);
      });
      select.value = current;
    }

    function populateFilters() {
      populateSelect(els.city, applications.map(item => item.city));
      populateSelect(els.category, applications.map(item => item.category), {
        company: "Company", "applied-research": "Applied research", LUH: "LUH"
      });
      populateSelect(els.status, applications.map(item => item.status));
    }

    function populateLuhFilters() {
      populateSelect(els.luhInstitute, luhRecords.map(item => item.institute));
      populateSelect(els.luhStatus, luhRecords.map(item => item.status));
    }

    function getVisibleItems() {
      const query = els.search.value.trim().toLowerCase();
      const searchable = item => [item.organization, item.city, item.title, item.category,
        item.technical_focus.join(" "), item.notes, item.contact_person, item.next_action]
        .join(" ").toLowerCase().includes(query);
      const items = applications.filter(item =>
        (!query || searchable(item)) &&
        (!els.city.value || item.city === els.city.value) &&
        (!els.category.value || item.category === els.category.value) &&
        (!els.status.value || item.status === els.status.value)
      );
      return items.sort((a, b) => {
        if (els.sort.value === "organization") return a.organization.localeCompare(b.organization);
        if (els.sort.value === "recent") {
          return (b.last_contact || b.applied_date || "").localeCompare(a.last_contact || a.applied_date || "");
        }
        return (priorityRank[a.priority] ?? 9) - (priorityRank[b.priority] ?? 9)
          || a.organization.localeCompare(b.organization);
      });
    }

    function boardColumn(status) {
      return ["Rejected", "Offer", "Closed"].includes(status) ? "Closed" :
        columns.includes(status) ? status : "Found";
    }

    function getVisibleLuhItems() {
      const query = els.luhSearch.value.trim().toLowerCase();
      return luhRecords.filter(item => {
        const text = [item.institute, item.contact_person, item.title, item.technical_focus.join(" "), item.notes, item.next_action].join(" ").toLowerCase();
        return (!query || text.includes(query)) &&
          (!els.luhInstitute.value || item.institute === els.luhInstitute.value) &&
          (!els.luhStatus.value || item.status === els.luhStatus.value);
      }).sort((a, b) => (priorityRank[a.priority] ?? 9) - (priorityRank[b.priority] ?? 9) || a.institute.localeCompare(b.institute));
    }

    function renderSummary() {
      const formal = applications.filter(item => item.record_type !== "networking");
      els.summary.innerHTML = summaryStatuses.map(status => {
        const count = formal.filter(item => item.status === status).length;
        return `<article class="metric"><span class="metric-label">${status}</span><strong class="metric-value">${count}</strong></article>`;
      }).join("");
    }

    function cardTemplate(item) {
      const tags = item.technical_focus.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
      const networking = item.record_type === "networking" ? `<span class="tag networking">Networking · not an application</span>` : "";
      const link = /^https?:\/\//i.test(item.application_link) ?
        `<a href="${escapeHtml(item.application_link)}" target="_blank" rel="noopener noreferrer">Open link ↗</a>` : "—";
      return `<article class="card">
        <div class="card-top"><p class="org">${escapeHtml(item.organization)}</p><span class="priority ${escapeHtml(item.priority.toLowerCase())}" title="${escapeHtml(item.priority)} priority"></span></div>
        <h3 class="title">${escapeHtml(item.title)}</h3>
        <div class="meta"><span>⌖ ${escapeHtml(item.city)}</span><span>${escapeHtml(item.category)}</span></div>
        <div class="tag-row">${networking}${tags}</div>
        ${item.next_action ? `<p class="next"><strong>Next action</strong>${escapeHtml(item.next_action)}</p>` : ""}
        <details><summary>Details</summary><div class="details-grid">
          <span><b>Applied:</b> ${escapeHtml(item.applied_date || "unknown")}</span>
          <span><b>Last contact:</b> ${escapeHtml(item.last_contact || "unknown")}</span>
          <span><b>Contact:</b> ${escapeHtml([item.contact_person, item.contact_channel].filter(Boolean).join(" · ") || "—")}</span>
          <span><b>Notes:</b> ${escapeHtml(item.notes || "—")}</span>
          <span><b>Application:</b> ${link}</span>
        </div></details>
      </article>`;
    }

    function luhCardTemplate(item) {
      const tags = item.technical_focus.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
      const link = /^https?:\/\//i.test(item.project_link) ? `<a href="${escapeHtml(item.project_link)}" target="_blank" rel="noopener noreferrer">Official page ↗</a>` : "—";
      return `<article class="card">
        <div class="card-top"><p class="org">${escapeHtml(item.institute)}</p><span class="priority ${escapeHtml(item.priority.toLowerCase())}" title="${escapeHtml(item.priority)} priority"></span></div>
        <h3 class="title">${escapeHtml(item.title)}</h3>
        <div class="meta"><span>${escapeHtml(item.contact_person || "No contact yet")}</span></div>
        <div class="tag-row"><span class="tag status">${escapeHtml(item.status)}</span>${tags}</div>
        ${item.next_action ? `<p class="next"><strong>Next action</strong>${escapeHtml(item.next_action)}</p>` : ""}
        <details><summary>Evidence &amp; details</summary><div class="details-grid">
          <span><b>Reviewed:</b> ${escapeHtml(item.reviewed_date || "unknown")}</span>
          <span><b>First contact:</b> ${escapeHtml(item.first_contact || "not confirmed")}</span>
          <span><b>Last contact:</b> ${escapeHtml(item.last_contact || "—")}</span>
          <span><b>Notes:</b> ${escapeHtml(item.notes || "—")}</span>
          <span><b>Evidence:</b> ${escapeHtml(item.evidence || "—")}</span>
          <span><b>Link:</b> ${link}</span>
        </div></details>
      </article>`;
    }

    function render() {
      renderSummary();
      const visible = getVisibleItems();
      els.board.innerHTML = columns.map(column => {
        const items = visible.filter(item => boardColumn(item.status) === column);
        return `<section class="column"><header class="column-head"><h2 class="column-title">${column}</h2><span class="count">${items.length}</span></header>
          <div class="cards">${items.length ? items.map(cardTemplate).join("") : `<div class="empty">No matching records</div>`}</div></section>`;
      }).join("");
      els.sourceInfo.textContent = `${applications.length} records · ${sourceLabel}`;
    }

    function renderLuh() {
      els.luhSummary.innerHTML = luhSummaryStatuses.map(status => {
        const count = luhRecords.filter(item => item.status === status).length;
        return `<article class="metric"><span class="metric-label">${status}</span><strong class="metric-value">${count}</strong></article>`;
      }).join("");
      const visible = getVisibleLuhItems();
      els.luhBoard.innerHTML = luhColumns.map(column => {
        const items = visible.filter(item => item.status === column);
        return `<section class="column"><header class="column-head"><h2 class="column-title">${column}</h2><span class="count">${items.length}</span></header>
          <div class="cards">${items.length ? items.map(luhCardTemplate).join("") : `<div class="empty">No matching records</div>`}</div></section>`;
      }).join("");
      els.luhSourceInfo.textContent = `${luhRecords.length} LUH records · ${luhSourceLabel}`;
    }

    async function loadSource() {
      clearNotice();
      try {
        const response = await fetch("applications.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        validateAndSet(await response.json(), "applications.json");
      } catch (error) {
        const fallback = JSON.parse(document.querySelector("#fallbackData").textContent);
        validateAndSet(fallback, "built-in snapshot");
        showNotice("Local file mode: showing the built-in snapshot. Use “Import JSON” to load an edited applications.json file, or open through GitHub Pages for automatic loading.");
      }
    }

    async function loadLuhSource() {
      els.luhNotice.classList.remove("visible");
      try {
        const response = await fetch("luh.json", { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        validateAndSetLuh(await response.json(), "luh.json");
      } catch (error) {
        const fallback = JSON.parse(document.querySelector("#luhFallbackData").textContent);
        validateAndSetLuh(fallback, "built-in snapshot");
        els.luhNotice.textContent = "Local file mode: the LUH section uses its built-in snapshot. Open the GitHub Pages site for automatic updates.";
        els.luhNotice.classList.add("visible");
      }
    }

    [els.search, els.city, els.category, els.status, els.sort].forEach(control =>
      control.addEventListener(control === els.search ? "input" : "change", render));

    [els.luhSearch, els.luhInstitute, els.luhStatus].forEach(control =>
      control.addEventListener(control === els.luhSearch ? "input" : "change", renderLuh));

    document.querySelectorAll(".view-tab").forEach(button => button.addEventListener("click", () => {
      document.querySelectorAll(".view-tab").forEach(tab => tab.classList.toggle("active", tab === button));
      document.querySelector("#applicationsView").hidden = button.dataset.view !== "applications";
      document.querySelector("#luhView").hidden = button.dataset.view !== "luh";
    }));

    els.file.addEventListener("change", async event => {
      const file = event.target.files[0];
      if (!file) return;
      try {
        validateAndSet(JSON.parse(await file.text()), file.name);
        clearNotice();
        showNotice(`Loaded ${file.name}. Export after changes if you want a new JSON copy.`);
      } catch (error) {
        showNotice(`Could not load JSON: ${error.message}`);
      } finally {
        event.target.value = "";
      }
    });

    document.querySelector("#exportButton").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(applications, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const anchor = Object.assign(document.createElement("a"), { href: url, download: "applications.json" });
      anchor.click();
      URL.revokeObjectURL(url);
    });

    document.querySelector("#resetButton").addEventListener("click", () => Promise.all([loadSource(), loadLuhSource()]));
    Promise.all([loadSource(), loadLuhSource()]);
  </script>
</body>
</html>
